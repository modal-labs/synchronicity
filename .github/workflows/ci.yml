name: Run Python Tests
on: push

jobs:
  tests:
    strategy:
      fail-fast: false # run all variants across python versions/os to completion
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        os: ["ubuntu-latest"]
        include:
          - os: "macos-15-intel" # x86-64
            python-version: "3.10"
          - os: "macos-15" # ARM64 (M1)
            python-version: "3.10"
          - os: "windows-latest"
            python-version: "3.10"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4.2.2
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Install Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5.5.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --group=dev
      - name: Run tests with pytest
        run: uv run --group=dev pytest -s
      - name: Run README tests
        run: uv run --group=dev pytest --markdown-docs README.md
